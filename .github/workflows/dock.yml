name: Dock Rust and Qt
on:
  push:
    paths: ['common/dock/**', '.github/workflows/dock.yml']
  pull_request:
    paths: ['common/dock/**', '.github/workflows/dock.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential cmake ninja-build pkg-config mold python3 qt6-base-dev qt6-declarative-dev qmake6 qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript libxcb1-dev libglib2.0-dev xvfb xauth openbox x11-utils xdotool
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: bash common/dock/build.sh
      - name: Core and QML tests
        run: ctest --test-dir common/dock/build --output-on-failure
      - name: X11 startup smoke test
        run: xvfb-run -a bash common/dock/tests/smoke-x11.sh
      - name: Rust native X11 regression
        run: xvfb-run -a common/dock/build/dock-x11-grab-test
