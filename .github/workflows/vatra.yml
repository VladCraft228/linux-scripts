name: Vatra

on:
  push:
    paths:
      - 'common/vatra/**'
      - '.github/workflows/vatra.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'common/vatra/**'
      - '.github/workflows/vatra.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    defaults:
      run:
        working-directory: common/vatra
    steps:
      - name: Install Debian dependencies
        working-directory: .
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config dpkg-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libglib2.0-dev desktop-file-utils fontconfig fonts-dejavu-core \
            python3 python3-gi gir1.2-gtk-3.0 dbus-daemon libglib2.0-bin \
            xvfb xauth xdotool trayer weston
      - uses: actions/checkout@v4
      - name: Install Rust
        working-directory: .
        run: |
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/vatra-rustup.sh
          sh /tmp/vatra-rustup.sh -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          cargo test --locked
          python3 -m py_compile packaging/vatra-tlp-helper
      - name: Test SNI on an isolated session bus
        run: dbus-run-session -- env VATRA_TEST_SNI=1 cargo test --locked isolated_sni_registration_and_recovery
      - name: Smoke test X11 and Wayland
        run: |
          cargo build --locked --features test-support
          dbus-run-session -- xvfb-run -a bash tests/smoke.sh x11 target/debug/vatra
          dbus-run-session -- bash tests/smoke.sh wayland target/debug/vatra
      - name: Build and inspect package
        run: |
          bash packaging/build-deb.sh
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: vatra-debian-trixie
          path: common/vatra/dist/*.deb
          if-no-files-found: error
