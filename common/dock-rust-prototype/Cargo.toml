[package]
name = "prychal-dock"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
x11rb = { version = "0.13.2", features = ["render", "shape", "composite", "xkb"] }
tiny-skia = "0.11.4"
resvg = { version = "0.45.1", default-features = false }
freedesktop-icons = "0.4.0"
shell-words = "1.1"
serde_json = "1"
fontdue = "0.9.3"
sha2 = "0.10"
percent-encoding = "2"
zbus = "=4.4.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies.rustix]
version = "0.38.44"
features = ["event"]
