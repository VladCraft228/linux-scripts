[package]
name = "dock-rust"
version = "0.5.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
qt = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
gethostname = "1"
gio = "0.20"
x11rb = { version = "0.13", features = ["shape"] }
cxx = { version = "1", optional = true }
cxx-qt = { version = "0.8", optional = true }
cxx-qt-lib = { version = "0.8", features = ["qt_gui"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "0.8", optional = true }
